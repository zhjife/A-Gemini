name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21 环境
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 补齐基础配置文件
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 自动生成 debug.keystore 签名证书（解决缺少签名文件问题）
        run: |
          # 自动在根目录下生成标准的 Android Debug 签名密钥
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          # 顺便在 app 目录下和用户主目录下也备份一份，防止不同路径引用
          cp debug.keystore app/debug.keystore || true
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore || true
          echo "已成功生成 debug.keystore"

      - name: 接受 Android SDK 协议
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 安装项目指定的 Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 编译生成 Debug 版 APK
        run: gradle assembleDebug --stacktrace

      - name: 上传打包好的 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
